<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/layout :: head('Receipt Details')"></head>

<body>

<div th:replace="fragments/layout :: header"></div>

<main class="container py-4">
    <h1 class="text-center mt-2 mb-4" style="color: #8190A5;font-weight: 600;">Receipt Details</h1>
    <hr class="mt-1">

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card" style="margin-bottom: 35px;">
                <div class="card-header bg-light">
                    <h5 class="mb-0 text-center">Order Summary</h5>
                </div>
                <div class="card-body p-0">

                    <div class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
                        <div class="text-secondary fw-semibold">Order Number: <span class="text-dark" th:text="${receipt.orderId}">1</span></div>
                        <div class="text-secondary fw-semibold">Order Date: <span class="text-dark" th:text="${receipt.orderDate}">2024-01-01</span></div>
                    </div>

                    <div class="row g-0">
                        <div class="col-md-7 border-end">
                            <div class="p-4">
                                <h6 class="fw-bold mb-3">Items Purchased</h6>
                                <div style="max-height: 350px; overflow-y: auto;">
                                    <div th:each="item,iterStat : ${receipt.items}">
                                        <div class="d-flex align-items-center" th:classappend="${!iterStat.last} ? ' mb-3'">
                                            <div class="flex-grow-1">
                                                <div class="fw-semibold" th:text="${item.itemName}">Item Name</div>
                                                <div class="text-secondary small">Qty: <span th:text="${item.quantity}">1</span></div>
                                            </div>
                                            <div class="text-end">
                                                <div class="fw-semibold" th:text="${'$' + #numbers.formatDecimal(item.itemPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                                                <div class="text-secondary small" th:if="${item.quantity > 1}" th:text="${'Line Total: $' + #numbers.formatDecimal(item.itemPrice * item.quantity, 1, 'COMMA', 2, 'POINT')}"></div>
                                            </div>
                                        </div>
                                        <hr th:if="${!iterStat.last}" />
                                    </div>
                                </div>
                            </div>

                            <div class="px-4 py-3 border-top bg-light">
                                <div class="row text-secondary small">
                                    <div class="col-md-6">
                                        <div class="fw-semibold text-dark mb-1">Purchaser</div>
                                        <div class="text-dark" th:text="${receipt.purchaserEmail}">customer@example.com</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="fw-semibold text-dark mb-1">Shipping Address</div>
                                        <div class="text-dark">
                                            <span th:text="${receipt.shippingName}">John Doe</span><br>
                                            <span th:text="${receipt.shippingAddress}">123 Main St, City, ST 00000</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="p-4" style="font-size: 17px;">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-secondary">Subtotal</span>
                                    <span class="fw-semibold" th:text="${'$' + #numbers.formatDecimal(receipt.subtotal, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-secondary">Shipping</span>
                                    <span class="fw-semibold" th:text="${'$' + #numbers.formatDecimal(receipt.shippingCost, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-secondary">Tax</span>
                                    <span class="fw-semibold" th:text="${'$' + #numbers.formatDecimal(receipt.tax, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between">
                                    <span class="fw-semibold">Total</span>
                                    <span class="fw-bold" th:text="${'$' + #numbers.formatDecimal(receipt.total, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center my-4">
                <a th:href="@{/admin/sales-report}" class="btn btn-primary rounded-pill fw-bold px-5" style="font-size: 17px;">
                    <i class="bi bi-arrow-left"></i> Back to Sales Report
                </a>
            </div>
        </div>
    </div>

    <div class="mb-5"></div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<div th:replace="fragments/layout :: scripts"></div>

</body>

</html>
