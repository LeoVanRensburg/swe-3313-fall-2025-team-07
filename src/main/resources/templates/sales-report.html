<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-7s3v3sB9S3rUu5s+K3l8uJdN5A5cV+3n5o6lQqvU9c9yqB0Qz6QncxY2kqJm0s3V" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</head>
<body>
<nav class="navbar" style="background-color: #0060FF;">
    <div class="container-fluid align-items-center">
        <a href="home.html" class="navbar-brand text-white fs-1 me-4 fw-bold">Big5</a>
        <a href="#" class="btn btn-light rounded-pill px-4 me-2 fw-bold">All Items</a>
        <a href="catagories.html" class="btn btn-light rounded-pill px-4 me-2 fw-bold">Categories</a>
        <form class="d-flex flex-grow-1 mx-3" role="search">
            <input type="text" class="form-control rounded-pill" placeholder="Search for items">
        </form>
        <button class="btn btn-light rounded-pill me-2">
            <i class="bi bi-cart fs-4 px-2"></i>
        </button>
        <button class="btn btn-light rounded-pill">
            <i class="bi bi-person fs-4 px-2"></i>
        </button>
    </div>

</nav>
<p class="fw-bold fs-4 text-center">Sales Report</p>

<div class="container-fluid">
    <table class="table table-center">
        <thead>
        <tr class="text-center table-primary">
            <th>Item</th>
            <th>Purchaser Name</th>
            <th>Purchaser Email</th>
            <th>Price</th>
            <th>Checkout Confirmation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="4" class="text-center pt-1 pb-2">
                <div class="mb-2 text-center">
                    <i class="bi bi-cart-x text-muted" style="font-size: 11rem;"></i>
                </div>
                <div class="fw-bold mb-5" style="font-size: 25px;color: #595C5F;">
                    There are no items in your cart.
                </div>
            </td>
        </tr>
        <th:block th:each="cartItem : ${cartItems}">
            <tr>
                <td>
                    <img th:src="@{'/pictures/' + ${cartItem.image}}" class="img-fluid" style="max-width: 100px;"
                         th:alt="${cartItem.name}">
                    <div th:text="${cartItem.name}">Item Name</div>
                </td>
                <td>
                    <input type="number" class="form-control" th:value="${item.quantity}" min="1" style="width: 80px;margin-top: 35px" disabled>
                </td>
                <td class="pt-5" th:text="${'$' + #numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td class="pt-5" th:text="${'$' + #numbers.formatDecimal(item.price * item.quantity, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
            </tr>
            <tr>
                <td colspan="4" class="py-0"><hr class="mt-1"></td>
            </tr>
        </th:block>
            <td>
                <button type="button" class="btn btn-primary rounded-pill px-4 me-2 fw-bold">Checkout confirmation</button>
            </td>
        </tbody>
    </table>
</div>

<div class="container-fluid align-items-right">
    <a th:href="@{/admin/sales-report/download}" type="button" class="btn btn-primary rounded-pill px-4 me-2 fw-bold">Export to CSV</a>

</div>

<main>

</main>
<footer>
</footer>
</body>
</html>
