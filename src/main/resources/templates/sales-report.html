<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Sales Report')"></head>
<body>

<div th:replace="fragments/layout :: header"></div>
<p class="fw-bold fs-4 text-center">Sales Report</p>

<div class="container-fluid">
    <table class="table table-hover">
        <thead>
        <tr class="text-center table-primary">
            <th>Item Name</th>
            <th>Date Sold</th>
            <th>Purchaser Email</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Line Total</th>
            <th>View Receipt</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="7" class="text-center pt-4 pb-4">
                <div class="mb-2 text-center">
                    <i class="bi bi-receipt text-muted" style="font-size: 8rem;"></i>
                </div>
                <div class="fw-bold mb-3" style="font-size: 20px;color: #595C5F;">
                    No sales have been recorded yet.
                </div>
            </td>
        </tr>
        <tr th:each="row : ${rows}" class="text-center align-middle">
            <td class="fw-bold" th:text="${row.itemName}">Item Name</td>
            <td th:text="${row.date}">Date</td>
            <td th:text="${row.purchaserEmail}">Email</td>
            <td th:text="${'$' + #numbers.formatDecimal(row.itemPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
            <td th:text="${row.quantity}">1</td>
            <td th:text="${'$' + #numbers.formatDecimal(row.itemPrice * row.quantity, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
            <td>
                <a th:href="@{'/admin/sales-report/' + ${row.orderId}}" class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-receipt"></i> View Receipt
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="container-fluid d-flex justify-content-end mb-4">
    <a th:href="@{/admin/sales-report/download}" class="btn btn-primary rounded-pill px-4 fw-bold">
        <i class="bi bi-download"></i> Export to CSV
    </a>
</div>

<div th:replace="fragments/layout :: footer"></div>
<div th:replace="fragments/layout :: scripts"></div>
</body>
</html>
